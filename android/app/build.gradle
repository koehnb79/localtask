plugins { id 'com.android.application' }
android {
    namespace 'com.solemntreeapps.localtask'
    compileSdk 35
    defaultConfig { applicationId 'com.solemntreeapps.localtask'; minSdk 26; targetSdk 35; versionCode 9; versionName '0.5'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // ZXing uses these classes for camera permission checks at runtime.
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' 
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
